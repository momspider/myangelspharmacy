<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Medicine Detail — Angel's Pharmacy</title>
    <link rel="stylesheet" href="css/medicine.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/auth.js"></script>
</head>

<body>

    <nav class="site-nav" aria-label="Main navigation">
        <div class="nav-container">
            <a class="brand" href="index.html">
                <div class="brand-icon" id="logo-wrap">
                    <img id="logo-img" src="assets/logo.png" alt="Angel's Pharmacy Logo"
                        style="width:100%;height:100%;object-fit:contain;" />
                    <span id="logo-fallback">A+</span>
                </div>
                Angel's Pharmacy
            </a>
            <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu"
                aria-label="Toggle navigation">☰</button>
            <ul id="nav-menu" class="nav-menu" hidden>
                <li><a href="catalog.html">Medicines</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="more-info.html">More Info</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div id="nav-auth" style="display:flex;gap:8px;align-items:center;flex-shrink:0;"></div>
        </div>
    </nav>

    <div class="detail-wrap">
        <div class="breadcrumb">
            <a href="index.html">Home</a> › <a href="catalog.html">Medicines</a> › <span
                id="breadcrumb-name">Loading…</span>
        </div>

        <div id="detail-content">
            <div style="text-align:center;padding:60px;color:var(--muted);">Loading medicine details…</div>
        </div>
    </div>

    <footer
        style="max-width:var(--container);margin:0 auto;padding:22px 24px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border);">
        <span id="year"></span> Angel's Pharmacy — Valenzuela City &nbsp;|&nbsp;
        <a href="contact.html">Contact Us</a>
    </footer>

    <!-- LOGIN PROMPT -->
    <div class="login-prompt-overlay" id="login-prompt" onclick="handlePromptOverlay(event)">
        <div class="login-prompt-modal">
            <div class="login-prompt-ico">🔐</div>
            <h3>Login Required</h3>
            <p id="login-prompt-msg">Please log in to add this medicine to your cart.</p>
            <div class="login-prompt-btns">
                <button class="btn-ghost" onclick="closeLoginPrompt()">Continue Browsing</button>
                <a href="index.html" class="btn" id="login-redirect-btn">Log In / Sign Up</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/medicine.js"></script>
</body>

</html>
